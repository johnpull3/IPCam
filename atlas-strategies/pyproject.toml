[project]
name = "atlas-strategies"
version = "0.1.0"
description = "Strategy pack for Atlas trading bot"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_strategies*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["atlas_strategies/tests"]
